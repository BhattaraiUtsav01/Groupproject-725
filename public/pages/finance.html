<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentLife - Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
  <nav class="bg-white/90 backdrop-blur dark:bg-gray-800 sticky top-0 z-40 shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-8 nav">
      <a href="/home" class="font-bold text-blue-600 text-lg">StudentLife</a>
      <a href="/home" class="">Home</a>
      <a href="/profile" class="">Profile</a>
      <a href="/rooms" class="">Rooms</a>
      <a href="/supermarkets" class="">Supermarkets</a>
      <a href="/shop" class="">Marketplace</a>
      <a href="/finance" class="">Finance</a>
      <a href="/community" class="">Community</a>
      <a href="/dashboard" class="">Dashboard</a>
    </div>
    <button id="theme-toggle" class="text-gray-500">🌓</button>
  </div>
</nav>
  <main>
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <h1 class="text-3xl font-bold mb-6">Finance Analysis & Calculator</h1>
  <div class="grid lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Weekly Expenses</h2>
        <div class="grid md:grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium mb-2">Rent</label><input class="expense-input w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-gray-100" type="number"></div>
          <div><label class="block text-sm font-medium mb-2">Groceries</label><input class="expense-input w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-gray-100" type="number"></div>
          <div><label class="block text-sm font-medium mb-2">Transport</label><input class="expense-input w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-gray-100" type="number"></div>
          <div><label class="block text-sm font-medium mb-2">Entertainment</label><input class="expense-input w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-gray-100" type="number"></div>
          <div><label class="block text-sm font-medium mb-2">Other</label><input class="expense-input w-full px-3 py-2 border rounded dark:bg-gray-700 dark:text-gray-100" type="number"></div>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Expense Breakdown</h2>
        <div class="grid md:grid-cols-3 gap-4 mb-6">
          <div class="text-center"><div class="text-2xl font-bold text-red-600" id="total-expenses">$0.00</div><div class="text-sm text-gray-500">Total Expenses</div></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <canvas id="expense-chart" height="160"></canvas>
      </div>
    </div>
    <aside class="space-y-6">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold mb-2">Tips</h3>
        <p class="text-sm text-gray-600 dark:text-gray-300">Track weekly to keep spending under control.</p>
      </div>
    </aside>
  </div>
</section>
</main>
  <footer class="footer bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto py-6 text-center text-sm text-gray-500 dark:text-gray-400">StudentLife © 2025</div>
  </footer>
  <script src="/js/common.js"></script>
<script src="/js/finance.js"></script>
</body>
</html>
